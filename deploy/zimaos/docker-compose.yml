# OnDesk — stack completo para ZimaOS
#
# Este es el YAML que se pega en ZimaOS: Apps -> Custom Install -> Import.
# Las imagenes las construye y publica GitHub Actions en GHCR (.github/workflows/build.yml).
#
# ANTES DE INSTALAR:
#   1. Reemplazar thedanthes por tu usuario de GitHub en minusculas
#      (aparece dos veces, en los servicios api y client).
#   2. Cambiar POSTGRES_PASSWORD, la misma contraseña dentro de DATABASE_URL,
#      y SECRET (generar con: openssl rand -base64 32).
#   3. Si los paquetes son privados, en el NAS: sudo docker login ghcr.io
#      y bajar las imagenes con sudo docker pull antes de importar este YAML.

name: ondesk

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: ondesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ondesk
      POSTGRES_PASSWORD: cambiame_en_produccion
      POSTGRES_DB: ondesk
    volumes:
      - /media/ZimaOS-HD/AppData/ondesk/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondesk -d ondesk"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ondesk

  api:
    image: ghcr.io/thedanthes/ondesk-api:beta
    container_name: ondesk-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ondesk:cambiame_en_produccion@postgres:5432/ondesk
      # Clave de firma de sesiones, en base64. Generar con: openssl rand -base64 32
      SECRET: Q0FNQklBTUUtRVNUQS1DTEFWRS1BTlRFUy1ERS1VU0FS
      NODE_ENV: production
    # La API guarda los adjuntos en ./uploads relativo a /app (su working dir).
    volumes:
      - /media/ZimaOS-HD/AppData/ondesk/uploads:/app/uploads
    ports:
      - "3101:3001"
    networks:
      - ondesk

  client:
    image: ghcr.io/thedanthes/ondesk-client:beta
    container_name: ondesk-client
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3002:3002"
    networks:
      - ondesk

networks:
  ondesk:
    driver: bridge

x-casaos:
  architectures:
    - amd64
  main: client
  author: OnDesk
  developer: OnDesk
  category: Utilities
  title:
    en_us: OnDesk
  description:
    en_us: Mesa de ayuda multiempresa. Cada usuario ve solo los tickets de las empresas que tiene asignadas.
  tagline:
    en_us: Tickets por empresa
  scheme: http
  port_map: "3002"
  index: /
  store_app_id: ondesk
