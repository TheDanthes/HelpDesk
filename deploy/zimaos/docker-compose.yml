# OnDesk — stack completo para ZimaOS
#
# Este es el YAML que se pega en ZimaOS: Apps -> Custom Install -> Import.
# Requiere que las imagenes ondesk/api:beta y ondesk/client:beta ya existan
# en el Docker del ZimaOS (ver docker-compose.build.yml y el README).
#
# Antes de instalar, cambiar ONDESK_SECRET y POSTGRES_PASSWORD mas abajo.

name: ondesk

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: ondesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ondesk
      POSTGRES_PASSWORD: cambiame_en_produccion
      POSTGRES_DB: ondesk
    volumes:
      - /DATA/AppData/ondesk/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondesk -d ondesk"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ondesk

  api:
    image: ondesk/api:beta
    container_name: ondesk-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ondesk:cambiame_en_produccion@ondesk-postgres:5432/ondesk
      # Clave de firma de sesiones, en base64. Generar una propia con:
      #   openssl rand -base64 32
      SECRET: Q0FNQklBTUUtRVNUQS1DTEFWRS1BTlRFUy1ERS1VU0FS
      NODE_ENV: production
    # La API guarda los adjuntos en ./uploads relativo a /app (su working dir).
    volumes:
      - /DATA/AppData/ondesk/uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - ondesk

  client:
    image: ondesk/client:beta
    container_name: ondesk-client
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3002:3002"
    networks:
      - ondesk

networks:
  ondesk:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: client
  author: OnDesk
  developer: OnDesk
  category: Utilities
  title:
    en_us: OnDesk
  description:
    en_us: Mesa de ayuda multiempresa. Cada usuario ve solo los tickets de las empresas que tiene asignadas.
    es_es: Mesa de ayuda multiempresa. Cada usuario ve solo los tickets de las empresas que tiene asignadas.
  tagline:
    en_us: Tickets por empresa
    es_es: Tickets por empresa
  scheme: http
  port_map: "3002"
  index: /
  store_app_id: ondesk
