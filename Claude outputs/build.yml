# Construye las imagenes de OnDesk y las publica en GHCR.
#
# Corre en cada push a main y tambien a mano desde la pestaña Actions.
# No hace falta configurar ningun secreto: GITHUB_TOKEN ya alcanza para
# publicar en el GHCR del mismo dueño del repositorio.
#
# Publica:
#   ghcr.io/<usuario>/ondesk-api:beta
#   ghcr.io/<usuario>/ondesk-client:beta
# y ademas una etiqueta con el sha del commit, para poder volver atras.

name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: client
            dockerfile: apps/client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre en minusculas y el usuario de GitHub puede tener
      # mayusculas, asi que lo normalizamos en vez de escribirlo a mano.
      - id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/ondesk-${{ matrix.name }}:beta
            ghcr.io/${{ steps.owner.outputs.lower }}/ondesk-${{ matrix.name }}:${{ github.sha }}
          # Next hornea API_URL en el bundle durante el build, no al arrancar.
          # Tiene que coincidir con el nombre del servicio en el compose.
          build-args: |
            API_URL=http://api:3001
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
